<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA AI | Enterprise Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: radial-gradient(circle at top left, #1e293b, #0f172a);
            color: #f8fafc;
            min-height: 100vh;
        }

        /* Glassmorphism */
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .glass-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            border-color: rgba(14, 165, 233, 0.4);
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-left-color: #0ea5e9;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="mb-10 flex items-center justify-between animate-fade-in">
            <div>
                <h1 class="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-600">
                    NEXORA AI
                </h1>
                <p class="text-slate-400 mt-1">Enterprise Data Intelligence Platform</p>
            </div>
            <div class="hidden md:block">
                <span class="px-3 py-1 rounded-full glass text-xs font-mono text-cyan-300">v1.0.0-RC1</span>
            </div>
        </header>

        <!-- Main Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">

            <!-- Left Panel: Configuration -->
            <div class="lg:col-span-4 space-y-6 animate-fade-in" style="animation-delay: 0.1s;">
                <div class="glass-card p-6">
                    <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        Configuration
                    </h2>

                    <div class="space-y-4">
                        <!-- File Upload -->
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-1">Dataset (CSV)</label>
                            <div class="relative">
                                <input type="file" id="file-upload" accept=".csv" class="block w-full text-sm text-slate-300
                                  file:mr-4 file:py-2 file:px-4
                                  file:rounded-full file:border-0
                                  file:text-sm file:font-semibold
                                  file:bg-brand-600 file:text-white
                                  hover:file:bg-brand-500
                                  glass rounded-lg cursor-pointer
                                " />
                            </div>
                        </div>

                        <!-- Task -->
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-1">Task Type</label>
                            <select id="task-select"
                                class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:ring-2 focus:ring-cyan-500">
                                <option value="regression">Regression (Predict Number)</option>
                                <option value="classification">Classification (Predict Category)</option>
                            </select>
                        </div>

                        <!-- Algorithm -->
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-1">Algorithm</label>
                            <select id="algo-select"
                                class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:ring-2 focus:ring-cyan-500">
                                <option value="rf">Random Forest (Ensemble)</option>
                                <option value="linear">Linear Regression</option>
                                <option value="logistic">Logistic Regression</option>
                            </select>
                        </div>

                        <!-- Target -->
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-1">Target Column</label>
                            <select id="target-select" disabled
                                class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-slate-400 disabled:opacity-50 cursor-not-allowed">
                                <option>Upload file first...</option>
                            </select>
                        </div>

                        <button id="run-btn" disabled
                            class="w-full mt-4 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold py-3 px-6 rounded-lg shadow-lg transform transition disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center gap-2">
                            <span>Run Analysis</span>
                            <div id="btn-spinner" class="spinner hidden"></div>
                        </button>
                    </div>
                </div>

                <!-- System Status -->
                <div class="glass-card p-4 hidden" id="system-status">
                    <div class="flex items-center gap-3">
                        <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                        <p class="text-sm text-slate-300 font-mono" id="status-msg">System Ready</p>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Results -->
            <div class="lg:col-span-8 space-y-6 animate-fade-in" style="animation-delay: 0.2s;">

                <!-- Welcome / Empty State -->
                <div id="empty-state" class="glass-card p-12 text-center border-dashed border-2 border-slate-700">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-800 mb-4">
                        <svg class="w-8 h-8 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                        </svg>
                    </div>
                    <h3 class="text-xl font-medium text-slate-300">Ready for Intelligence</h3>
                    <p class="text-slate-500 mt-2">Upload a dataset and configure the pipeline to start.</p>
                </div>

                <!-- Results Container -->
                <div id="results-container" class="hidden space-y-6">

                    <!-- Top Metrics -->
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="metrics-grid">
                        <!-- Injected JS -->
                    </div>

                    <!-- Charts & Narrative -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Feature Importance -->
                        <div class="glass-card p-6">
                            <h3 class="text-lg font-semibold mb-4 text-cyan-400">Key Drivers (SHAP)</h3>
                            <canvas id="shap-chart"></canvas>
                        </div>

                        <!-- Narrative & Anomalies -->
                        <div class="space-y-6">
                            <!-- Narrative -->
                            <div class="glass-card p-6 border-l-4 border-l-cyan-500">
                                <h3 class="text-lg font-semibold mb-2 flex items-center gap-2">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M13 10V3L4 14h7v7l9-11h-7z" />
                                    </svg>
                                    AI Insight
                                </h3>
                                <div id="narrative-text"
                                    class="text-slate-300 text-sm leading-relaxed whitespace-pre-line"></div>
                            </div>

                            <!-- Anomalies -->
                            <div class="glass-card p-6">
                                <div class="flex justify-between items-center mb-2">
                                    <h3 class="text-lg font-semibold text-orange-400">Data Health</h3>
                                    <span id="anomaly-badge"
                                        class="px-2 py-1 rounded text-xs font-bold bg-orange-900 text-orange-300">CHECKING</span>
                                </div>
                                <div class="grid grid-cols-2 gap-4 text-center">
                                    <div class="bg-slate-800/50 p-3 rounded-lg">
                                        <div class="text-2xl font-bold text-slate-100" id="anomaly-count">-</div>
                                        <div class="text-xs text-slate-500">Anomalies Detected</div>
                                    </div>
                                    <div class="bg-slate-800/50 p-3 rounded-lg">
                                        <div class="text-2xl font-bold text-slate-100" id="contamination">-</div>
                                        <div class="text-xs text-slate-500">Contamination %</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="flex justify-end gap-4 pt-4 border-t border-slate-700">
                        <a id="download-json" href="#" target="_blank"
                            class="px-4 py-2 rounded-lg border border-slate-600 text-slate-300 hover:bg-slate-800 transition text-sm flex items-center gap-2">
                            <span>JSON Audit</span>
                        </a>
                        <a id="view-report" href="#" target="_blank"
                            class="px-4 py-2 rounded-lg bg-green-600 hover:bg-green-700 text-white transition text-sm flex items-center gap-2 shadow-lg hover:shadow-green-500/20">
                            <span>View Executive Report</span>
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                            </svg>
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        let uploadedPath = "";
        let chartInstance = null;

        // 1. File Upload
        document.getElementById('file-upload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            const targetSelect = document.getElementById('target-select');
            targetSelect.innerHTML = "<option>Analyzing Schema...</option>";
            targetSelect.disabled = true;

            try {
                const res = await fetch('/api/upload', { method: 'POST', body: formData });
                const data = await res.json();

                uploadedPath = data.path;

                // Populate Columns
                targetSelect.innerHTML = "";
                data.columns.forEach(col => {
                    const opt = document.createElement('option');
                    opt.value = col;
                    opt.textContent = col;
                    // Auto-select if mostly unique or string? No, let's pick last col as heuristic or just first
                    targetSelect.appendChild(opt);
                });
                targetSelect.disabled = false;

                // Enable Run
                const runBtn = document.getElementById('run-btn');
                runBtn.disabled = false;
                runBtn.classList.remove('opacity-50');

                showStatus("Dataset uploaded successfully.", "success");

            } catch (err) {
                showStatus("Upload failed: " + err, "error");
            }
        });

        // 2. Run Pipeline
        document.getElementById('run-btn').addEventListener('click', async () => {
            const task = document.getElementById('task-select').value;
            const algo = document.getElementById('algo-select').value;
            const target = document.getElementById('target-select').value;

            setLoading(true);
            showStatus("Executing Pipeline... (Ingestion > Validation > Modeling > XAI)", "info");

            try {
                const res = await fetch('/api/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        source_path: uploadedPath,
                        target_column: target,
                        task: task,
                        algorithm: algo
                    })
                });

                if (!res.ok) throw await res.json();

                const result = await res.json();
                renderResults(result);
                showStatus("Analysis Complete!", "success");

            } catch (err) {
                showStatus("Error: " + (err.detail || err), "error");
            } finally {
                setLoading(false);
            }
        });

        function renderResults(data) {
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('results-container').classList.remove('hidden');

            // Metrics
            const metricsGrid = document.getElementById('metrics-grid');
            metricsGrid.innerHTML = "";
            for (const [key, val] of Object.entries(data.metrics)) {
                metricsGrid.innerHTML += `
                    <div class="glass-card p-4 text-center">
                        <div class="text-2xl font-bold text-cyan-400">${val < 1 ? val.toFixed(4) : val.toFixed(2)}</div>
                        <div class="text-xs text-slate-400 uppercase tracking-wider mt-1">${key.replace('_', ' ')}</div>
                    </div>
                `;
            }

            // Narrative
            document.getElementById('narrative-text').textContent = data.narrative;

            // Anomalies
            const summary = data.anomalies_summary;
            document.getElementById('anomaly-count').textContent = summary.anomaly_count;
            document.getElementById('contamination').textContent = (summary.contamination_ratio * 100).toFixed(2) + "%";

            const badge = document.getElementById('anomaly-badge');
            if (summary.anomaly_count > 0) {
                badge.textContent = "WARNING";
                badge.className = "px-2 py-1 rounded text-xs font-bold bg-orange-900 text-orange-300";
            } else {
                badge.textContent = "PASSED";
                badge.className = "px-2 py-1 rounded text-xs font-bold bg-green-900 text-green-300";
            }

            // Links
            if (data.html_report_path) {
                const fname = data.html_report_path.split(/[\\/]/).pop();
                document.getElementById('view-report').href = `/api/artifacts/${fname}`;
            }
            if (data.report_path) {
                const fname = data.report_path.split(/[\\/]/).pop();
                document.getElementById('download-json').href = `/api/artifacts/${fname}`;
            }

            // Chart
            renderChart(data.importance);
        }

        function renderChart(importance) {
            const ctx = document.getElementById('shap-chart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            const labels = Object.keys(importance);
            const values = Object.values(importance);

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Feature Importance',
                        data: values,
                        backgroundColor: 'rgba(14, 165, 233, 0.7)',
                        borderColor: 'rgba(14, 165, 233, 1)',
                        borderWidth: 1,
                        borderRadius: 4
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: { grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#94a3b8' } },
                        y: { grid: { display: false }, ticks: { color: '#e2e8f0' } }
                    }
                }
            });
        }

        function setLoading(isLoading) {
            const btn = document.getElementById('run-btn');
            const spinner = document.getElementById('btn-spinner');
            if (isLoading) {
                btn.disabled = true;
                spinner.classList.remove('hidden');
            } else {
                btn.disabled = false;
                spinner.classList.add('hidden');
            }
        }

        function showStatus(msg, type) {
            const el = document.getElementById('system-status');
            const txt = document.getElementById('status-msg');
            el.classList.remove('hidden');
            txt.textContent = msg;

            if (type === 'error') txt.classList.add('text-red-400');
            else if (type === 'success') txt.classList.add('text-green-400');
            else txt.classList.remove('text-red-400', 'text-green-400');
        }
    </script>
</body>

</html>
